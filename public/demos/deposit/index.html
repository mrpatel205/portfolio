<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit demo test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600&family=Inter:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --grey-10: #e6e6e6; --grey-30: #b3b3b3; --grey-70: #4d4d4d; --black: #000; --ease: cubic-bezier(0.16, 1, 0.3, 1); --fade: 0.5s; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--black); font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 64px 16px 96px; }
  h1 { font-size: 32px; line-height: 40px; font-weight: 500; margin: 0 0 8px; }
  .lede { font-size: 16px; line-height: 24px; color: var(--grey-70); max-width: 640px; margin: 0 0 40px; }

  /* Two demos side by side; stacked on small screens */
  /* Flow first, responsive view stacked below; each panel is the same size as the Hub demo */
  .pair { display: grid; grid-template-columns: 1fr; gap: 48px; }

  .demo { margin: 0; background: var(--grey-10); padding: clamp(16px, 4vw, 48px); }
  .demo__viewport { position: relative; width: 100%; aspect-ratio: 1440 / 1000; overflow: hidden; }
  .demo__stage { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
  .demo--flow .demo__viewport { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .screen { position: absolute; left: 0; top: 0; width: 1440px; opacity: 0; transition: opacity var(--fade) var(--ease); }
  .screen.is-on { opacity: 1; }
  .screen img { display: block; height: auto; }
  .scroller { transition: transform 1.1s var(--ease); }
  /* App shell stays fixed: content pane scrolls under the top bars and beside the side menu */
  .screen--shell { height: 1000px; }
  .screen--shell .pane { position: absolute; left: 296px; top: 100px; width: 1144px; height: 900px; overflow: hidden; }
  .screen--shell .sheet { position: relative; margin: -100px 0 0 -296px; width: 1440px; }
  .chrome { position: absolute; overflow: hidden; }
  .chrome img { display: block; }
  .chrome--top { left: 0; top: 0; width: 1440px; height: 100px; }
  .chrome--side { left: 0; top: 100px; width: 296px; height: 900px; }
  .chrome--side img { margin-top: -100px; }

  /* Typed amount over the hidden "[XXXXX]" layer (Figma 585,557 · Source Sans 3 16/24) */
  .typed { position: absolute; left: 585px; top: 557px; height: 24px; font: 400 16px/24px "Source Sans 3", sans-serif; color: #000; white-space: pre; }
  .caret { display: inline-block; width: 1px; height: 20px; margin-left: 1px; vertical-align: -4px; background: #000; opacity: 0; }
  .typed.is-focused .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .field-focus { position: absolute; left: 548px; top: 545px; width: 520px; height: 48px; border: 2px solid #000; border-radius: 4px; opacity: 0; pointer-events: none;
    transition: opacity .15s var(--ease); clip-path: polygon(0 0, 12px 0, 12px 10px, 70px 10px, 70px 0, 100% 0, 100% 100%, 0 100%); }
  .field-focus.is-on { opacity: 1; }
  .press { position: absolute; background: #000; opacity: 0; pointer-events: none; transition: opacity .12s ease-out; border-radius: 4px; }
  .press.is-down { opacity: .16; }
  .live-meter { position: absolute; left: 0; top: 0; pointer-events: none; font: 400 12px/16px "Source Sans 3", sans-serif; }
  .live-meter span { position: absolute; background: #fcfcfc; white-space: nowrap; }
  .lm-cap { top: 437px; left: 900px; width: 155px; text-align: right; color: #000; }
  .lm-notes { top: 483px; left: 785px; width: 150px; color: #555862; }
  .lm-track { position: absolute; left: 785px; top: 465px; width: 270px; height: 8px; border-radius: 4px; background: #d8dadf; overflow: hidden; }
  .lm-track b { display: block; height: 8px; width: 200px; border-radius: 4px; background: #c25222; }

  /* Responsive demo: the count screen rebuilt as live HTML (Elevate styles from Figma section 07).
     The window is dragged by its right edge; container queries reflow the layout every frame. */
  .window { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); height: 920px; width: 1440px; background: #fff; overflow: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); container: app / inline-size; }
  .resize-cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 5; pointer-events: none; }
  .resize-cursor svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }

  .ea { --ink: #000; --blue: #366b8f; --red: #da2e20; --red-dk: #b22418; --line: #e2e5e9; --panel: #e2e5e9; --soft: #ebedf0; --muted: #555862; --field: #9da0a9;
        font: 400 16px/24px "Source Sans 3", sans-serif; color: var(--ink); height: 100%; display: flex; flex-direction: column; width: 100%; }
  .ea svg { flex: none; display: block; }
  .ea-h-xl { font: 400 32px/40px "Epilogue", sans-serif; margin: 0; }
  .ea-h-l { font: 600 24px/32px "Epilogue", sans-serif; margin: 0; }
  .ea-h-m { font: 600 18px/24px "Epilogue", sans-serif; margin: 0; }
  .ea-sm { font-size: 14px; line-height: 20px; }
  .ea-xs { font-size: 12px; line-height: 16px; }
  .ea-semi { font-weight: 600; }
  .ea-muted { color: var(--muted); }

  /* Top bar */
  .ea-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; flex: none; color: #fff; position: relative; }
  .ea-top__left, .ea-top__right { display: flex; align-items: center; height: 48px; flex: 1 1 0; min-width: 0; }
  .ea-top__right { justify-content: flex-end; }
  .ea-bell { width: 48px; height: 48px; background: var(--red-dk); display: grid; place-items: center; }
  .ea-logo { margin-left: 16px; }
  .ea-search { width: 240px; height: 40px; border: 1px solid #808080; border-radius: 2px; display: flex; align-items: center; gap: 12px; padding: 0 12px; flex: none; font-size: 14px; line-height: 20px; }
  .ea-nav { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid #4d4d4d; font: 600 14px/20px "Source Sans 3", sans-serif; white-space: nowrap; }

  /* Customer bar */
  .ea-cust { min-height: 52px; background: #fff; border-bottom: 1px solid #ededed; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex: none; }
  .ea-cust__who { display: flex; align-items: center; gap: 16px; }
  .ea-cust__id { display: flex; align-items: center; gap: 16px; }
  .ea-name { display: flex; align-items: center; gap: 8px; font: 400 18px/24px "Epilogue", sans-serif; white-space: nowrap; }
  .ea-meid { display: flex; align-items: center; gap: 4px; font: 600 12px/16px "Source Sans 3", sans-serif; white-space: nowrap; }
  .ea-pills { display: flex; align-items: center; gap: 8px; }
  .ea-pill { height: 32px; border-radius: 999px; border: 1px solid #478244; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; font: 600 14px/20px "Source Sans 3", sans-serif; white-space: nowrap; }
  .ea-pill--plain { border-color: #b3b3b3; padding: 0 12px; }

  /* Body: side menu + main */
  .ea-body { flex: 1; display: flex; min-height: 0; }
  .ea-side { width: 296px; flex: none; background: #000; color: #fff; font-size: 14px; line-height: 20px; padding-bottom: 8px; }
  .ea-side__row { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 24px; white-space: nowrap; }
  .ea-side__row .grow { flex: 1; }
  .ea-badge { width: 22px; height: 22px; border-radius: 999px; background: #4d4d4d; display: grid; place-items: center; font-size: 12px; }
  .ea-activity { margin: 4px; height: 40px; border-radius: 4px; background: var(--red-dk); display: flex; align-items: center; padding: 0 12px 0 56px; justify-content: space-between; }
  .ea-side hr { border: 0; height: 2px; background: #4d4d4d; margin: 8px 8px 8px 16px; }

  .ea-main { flex: 1; min-width: 0; overflow: hidden; container: main / inline-size; display: flex; flex-direction: column; }
  .ea-page { padding: 40px 32px 0; display: flex; flex-direction: column; gap: 24px; max-width: 1144px; }
  .ea-cols { display: flex; gap: 24px; align-items: flex-start; }
  /* Desktop: the grey count-method panel holds its width (656) and the count summary shrinks from 400 until the tablet stack */
  .ea-summary { flex: 1 1 400px; max-width: 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .ea-card { background: #fcfcfc; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 24px; }
  .ea-card__body { display: flex; flex-direction: column; gap: 12px; }
  .ea-row { display: flex; justify-content: space-between; gap: 12px; }
  .ea-div { height: 1px; background: var(--line); }
  .ea-edit { background: var(--soft); border-radius: 6px; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  .ea-edit .lbl { color: var(--blue); flex: 1; }
  .ea-edit .amt { font: 600 20px/28px "Source Sans 3", sans-serif; }
  .ea-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 999px; font: 600 12px/16px "Source Sans 3", sans-serif; white-space: nowrap; }
  .ea-tag--ok { background: #e1f0d7; color: #2b641d; }
  .ea-tag--hi { background: #f5d8c6; color: #ab481c; }

  .ea-panel { flex: 0 0 656px; min-width: 0; background: var(--panel); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .ea-method { display: flex; align-items: center; gap: 16px; }
  .ea-seg { display: flex; align-items: center; background: #fff; border: 1px solid var(--field); border-radius: 6px; padding: 3px; flex: none; }
  .ea-seg span { height: 40px; padding: 0 24px; display: grid; place-items: center; border-radius: 4px; font: 600 14px/20px "Source Sans 3", sans-serif; min-width: 120px; }
  .ea-seg .on { background: var(--blue); color: #fff; }
  .ea-seg i { width: 1px; height: 24px; background: #bdbfc5; }
  .ea-cards { display: flex; gap: 16px; align-items: flex-start; }
  .ea-cards > .ea-card { flex: 1 1 0; min-width: 0; padding: 24px 16px; }
  .ea-btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .ea-btn { height: 40px; padding: 0 20px; border-radius: 4px; display: grid; place-items: center; font: 600 14px/20px "Source Sans 3", sans-serif; white-space: nowrap; }
  .ea-btn--out { border: 2px solid #242429; background: #fff; }
  .ea-btn--dark { background: #242429; color: #fff; }
  .ea-meter { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .ea-track { height: 8px; border-radius: 4px; background: #d8dadf; overflow: hidden; }
  .ea-track b { display: block; height: 8px; border-radius: 4px; background: #40842a; }
  .ea-counted { background: var(--panel); border-radius: 4px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; }
  .ea-total { background: var(--soft); border-radius: 6px; padding: 20px 16px; display: flex; justify-content: space-between; font: 600 18px/24px "Source Sans 3", sans-serif; }
  .ea-link { display: flex; align-items: center; gap: 8px; color: var(--blue); font: 600 14px/20px "Source Sans 3", sans-serif; height: 40px; }
  .ea-field { display: flex; flex-direction: column; gap: 8px; }
  .ea-input { height: 48px; border: 1px solid var(--field); border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 12px 0 16px; color: var(--muted); }

  .ea-foot { display: flex; align-items: center; justify-content: space-between; padding: 32px; gap: 16px; }
  .ea-foot__actions { display: flex; gap: 16px; }
  .ea-btn--red { background: var(--red); color: #fff; }
  .ea-close { color: var(--blue); font: 600 14px/20px "Source Sans 3", sans-serif; padding: 0 12px; white-space: nowrap; }

  /* --- Shell breakpoints (window width) --- */
  @container app (max-width: 1023px) {
    .ea-side { display: none; }
    .ea-nav { width: 52px; padding: 0 16px; } .ea-nav .lbl { display: none; }
    .ea-cust { min-height: 72px; }
    .ea-cust__id { flex-direction: column; align-items: flex-start; gap: 0; }
    .ea-pills { display: none; }
    .ea-page { padding: 48px 32px 0; }
  }
  @container app (max-width: 639px) {
    .ea-search { display: none; }
    .ea-page { padding: 40px 24px 0; }
    .ea-foot { padding: 32px 24px; }
    .ea-foot .prev { display: none; }
  }
  /* --- Content breakpoints (main column width) --- */
  /* Keyed to the window (not the main column) so the side menu dropping at 1024 can't flip it back to two columns */
  /* Tablet stack: the summary would drop under ~280px past this point */
  @container app (max-width: 1319px) {
    .ea-cols { flex-direction: column; align-items: stretch; }
    .ea-summary { max-width: none; flex: none; }
    .ea-panel { flex: none; }
  }
  @container main (max-width: 680px) {
    .ea-cards { flex-direction: column; align-items: stretch; }
    .ea-method { flex-direction: column; align-items: stretch; gap: 12px; }
    .ea-seg span { flex: 1; min-width: 0; }
  }

  /* Cursor: arrow by default, pointing hand over clickable things, I-beam over a text field, hidden while typing */
  .cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 5; pointer-events: none;
            transition: transform var(--move, .7s) var(--ease), opacity .12s linear; }
  .cursor svg { display: none; width: 26px; height: 26px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .cursor[data-shape="arrow"] .c-arrow, .cursor[data-shape="hand"] .c-hand, .cursor[data-shape="text"] .c-text { display: block; }
  .cursor.is-hidden { opacity: 0; }

  .demo__bar { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .demo__btn { font: 500 14px/20px "Inter", sans-serif; color: #000; background: #fff; border: 1px solid #000; padding: 6px 14px; cursor: pointer; }
  .demo__btn:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
  .demo__caption { font-size: 14px; line-height: 20px; color: var(--grey-70); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .screen, .scroller, .cursor { transition: none !important; }
    .resize-cursor { display: none; }
    .cursor, .typed, .field-focus, .press, .demo__btn { display: none; }
  }
</style>
<!-- Embedded in a case study (iframe ?embed): page chrome hidden, only the demo shows. -->
<script>
  (() => { const q = new URLSearchParams(location.search);
    if (q.has('embed')) document.documentElement.classList.add('embed');
    if (q.get('only')) document.documentElement.dataset.only = q.get('only'); })();
</script>
<style>
  html.embed body { background: transparent; }
  html.embed main { max-width: none; padding: 0; }
  html.embed h1, html.embed .lede, html.embed .demo__caption { display: none; }
  /* Screens sit at 80% of the grey panel's width, centred (Ash, 2026-11-17) */
  @media (min-width: 700px) { .demo__viewport { width: 80%; margin-inline: auto; } }
  html[data-only="flow"] #deposit-resp, html[data-only="resp"] #deposit-flow { display: none; }
</style>
</head>
<body>
<main>
  <h1>Keep everyday deposits quick</h1>
  <p class="lede">Test of two coded screen demos (no video). First: a simple cash deposit from account details to summary. Below it: the same count screen, rebuilt in HTML, as the window is dragged from desktop to mobile width and back.</p>

  <template id="cursor-tpl">
    <div class="cursor" data-shape="arrow" aria-hidden="true">
      <svg class="c-arrow" viewBox="0 0 26 26"><path d="M3 2.5v18.2l4.6-4.4 3 6.9 3.1-1.3-3-6.8h6.4z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <svg class="c-hand" viewBox="0 0 26 26">
        <g fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round">
          <rect x="8" y="1.5" width="4" height="13" rx="2"/><rect x="12" y="8" width="3.6" height="8" rx="1.8"/>
          <rect x="15.4" y="9" width="3.4" height="7" rx="1.7"/><rect x="18.6" y="10.5" width="3" height="6" rx="1.5"/>
          <rect x="8" y="12" width="13.6" height="11" rx="3.5"/><rect x="3.6" y="11.5" width="3.2" height="7.5" rx="1.6" transform="rotate(-35 5.2 15.2)"/>
        </g>
        <g fill="#fff">
          <rect x="8" y="1.5" width="4" height="13" rx="2"/><rect x="12" y="8" width="3.6" height="8" rx="1.8"/>
          <rect x="15.4" y="9" width="3.4" height="7" rx="1.7"/><rect x="18.6" y="10.5" width="3" height="6" rx="1.5"/>
          <rect x="8" y="12" width="13.6" height="11" rx="3.5"/><rect x="3.6" y="11.5" width="3.2" height="7.5" rx="1.6" transform="rotate(-35 5.2 15.2)"/>
        </g>
        <path d="M12 9.5v5.5M15.5 10.5v5M18.7 12v4" stroke="#000" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <svg class="c-text" viewBox="0 0 26 26">
        <path d="M10 4.5c1.5 0 3 .6 3 2v13c0 1.4 1.5 2 3 2M16 4.5c-1.5 0-3 .6-3 2v13c0 1.4-1.5 2-3 2M11 13h4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M10 4.5c1.5 0 3 .6 3 2v13c0 1.4 1.5 2 3 2M16 4.5c-1.5 0-3 .6-3 2v13c0 1.4-1.5 2-3 2M11 13h4" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
  </template>

  <div class="pair">
    <!-- Left: simple deposit flow -->
    <figure class="demo demo--flow" id="deposit-flow">
      <div class="demo__viewport" role="img"
           aria-label="Animated demo. A teller enters a $5,000 cash deposit, clicks Count notes, the counted cash matches the deposit amount, they confirm and the deposit summary shows.">
        <div class="demo__stage">
          <div class="screen is-on" data-screen="account">
            <img src="img/account.png" width="1440" height="1085" alt="">
            <div class="field-focus"></div>
            <div class="typed"><span class="typed__text"></span><span class="caret"></span></div>
            <div class="press" data-press="next" style="left:1120px;top:893px;width:68px;height:40px"></div>
          </div>
          <div class="screen screen--shell" data-screen="count">
            <!-- Only the page content scrolls; top bar + customer bar (0–100) and side menu (0–296) stay put -->
            <div class="pane"><div class="scroller"><div class="sheet">
              <img src="img/count-ready.png" width="1440" height="1346" alt="">
              <div class="press" data-press="count" style="left:785px;top:373px;width:113px;height:40px"></div>
            </div></div></div>
            <div class="chrome chrome--top"><img src="img/count-ready.png" width="1440" height="1346" alt=""></div>
            <div class="chrome chrome--side"><img src="img/count-ready.png" width="1440" height="1346" alt=""></div>
          </div>
          <div class="screen screen--shell" data-screen="match">
            <!-- Only the page content scrolls; top bar + customer bar (0–100) and side menu (0–296) stay put -->
            <div class="pane"><div class="scroller"><div class="sheet">
              <img src="img/count-match.png" width="1440" height="1346" alt="">
              <div class="press" data-press="confirm" style="left:1247px;top:1154px;width:161px;height:40px"></div>
              <!-- $100 cassette fills as the 50 notes go in: bar, held value + note count, remaining capacity -->
              <div class="live-meter" aria-hidden="true">
                <span class="lm-cap">$15,000 approx. capacity</span>
                <div class="lm-track"><b></b></div>
                <span class="lm-notes">$43,000 (430 notes)</span>
              </div>
            </div></div></div>
            <div class="chrome chrome--top"><img src="img/count-match.png" width="1440" height="1346" alt=""></div>
            <div class="chrome chrome--side"><img src="img/count-match.png" width="1440" height="1346" alt=""></div>
          </div>
          <div class="screen" data-screen="summary">
            <img src="img/summary.png" width="1440" height="1498" alt="">
          </div>
        </div>
      </div>
      <div class="demo__bar">
        <button class="demo__btn" type="button" aria-pressed="false">Pause</button>
        <p class="demo__caption" aria-hidden="true"></p>
      </div>
    </figure>

    <!-- Right: responsive view -->
    <figure class="demo demo--resp" id="deposit-resp">
      <div class="demo__viewport" role="img"
           aria-label="Animated demo. The count cash screen at desktop width, then tablet, then mobile, where the panels stack, then back to desktop.">
        <div class="demo__stage">
          <div class="window">
            <div class="ea" aria-hidden="true">
              <div class="ea-top">
                <div class="ea-top__left"><div class="ea-bell"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.6"><path d="M5 8a5 5 0 0 1 10 0v4l1.5 2.5h-13L5 12z"/><path d="M8 17h4"/></svg></div><span class="ea-logo"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 2l3 8.5h9l-7.2 5.3 2.8 8.7L14 19.2l-7.6 5.3 2.8-8.7L2 10.5h9z" fill="#da2e20"/></svg></span></div>
                <div class="ea-search"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg><span>Search customers</span></div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Shared helpers for one demo figure
  function setup(root) {
    const viewport = root.querySelector('.demo__viewport');
    const stage = root.querySelector('.demo__stage');
    const fit = () => { stage.style.transform = `scale(${viewport.clientWidth / 1440})`; };
    new ResizeObserver(fit).observe(viewport); fit();
    let paused = false, inView = false;
    new IntersectionObserver(([e]) => { inView = e.intersectionRatio >= 0.5; }, { threshold: [0, 0.5, 1] }).observe(viewport);
    const btn = root.querySelector('.demo__btn');
    btn.addEventListener('click', () => { paused = !paused; btn.textContent = paused ? 'Play' : 'Pause'; btn.setAttribute('aria-pressed', String(paused)); });
    const sleep = ms => new Promise(res => {
      let left = ms, last = performance.now();
      const tick = now => { if (!paused && inView) left -= now - last; last = now; left <= 0 ? res() : requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
    return { stage, sleep };
  }

  // ---------- Left: simple deposit ----------
  (() => {
    const root = document.getElementById('deposit-flow');
    const { stage, sleep } = setup(root);
    const screens = Object.fromEntries([...root.querySelectorAll('.screen')].map(s => [s.dataset.screen, s]));
    const show = name => { for (const [k, s] of Object.entries(screens)) s.classList.toggle('is-on', k === name); };
    if (reduce) { show('summary'); return; }

    const cursor = document.getElementById('cursor-tpl').content.firstElementChild.cloneNode(true);
    stage.appendChild(cursor);
    const typed = root.querySelector('.typed'), typedText = root.querySelector('.typed__text'), focusRing = root.querySelector('.field-focus');
    const caption = root.querySelector('.demo__caption');
    const say = t => { caption.textContent = t; };
    const press = n => root.querySelector(`[data-press="${n}"]`);

    const HOT = { arrow: [3, 2.5], hand: [10, 1.5], text: [13, 13] };
    let cx = 1000, cy = 760, shape = 'arrow', scrollY = 0;
    const place = () => { const [hx, hy] = HOT[shape]; cursor.style.transform = `translate(${cx - hx}px, ${cy - hy}px)`; };
    const setShape = s => { shape = s; cursor.dataset.shape = s; place(); };
    async function moveTo(x, y, target = 'arrow', ms = 700) {
      cursor.classList.remove('is-hidden'); cursor.style.setProperty('--move', ms + 'ms');
      if (shape !== 'arrow') setShape('arrow');
      cx = x; cy = y - scrollY; place();
      await sleep(ms * 0.55); if (target !== 'arrow') setShape(target); await sleep(ms * 0.45);
    }
    async function click(el) { el && el.classList.add('is-down'); await sleep(140); el && el.classList.remove('is-down'); }
    function scrollTo(y, instant) {
      scrollY = y;
      for (const s of root.querySelectorAll('.scroller')) {
        if (instant) s.style.transition = 'none';
        s.style.transform = `translateY(${-y}px)`;
        if (instant) { s.offsetHeight; s.style.transition = ''; }
      }
    }
    // $100 cassette: 430 → 480 notes ($43,000 → $48,000), remaining capacity $15,000 → $10,000, bar 200 → 223 of 270
    const lm = root.querySelector('.live-meter'), lmBar = lm.querySelector('.lm-track b'), lmNotes = lm.querySelector('.lm-notes'), lmCap = lm.querySelector('.lm-cap');
    const money = v => '$' + v.toLocaleString('en-AU');
    function setCassette(t) {
      const notes = Math.round(430 + 50 * t);
      lmBar.style.width = (200 + 23 * t) + 'px';
      lmNotes.textContent = `${money(notes * 100)} (${notes} notes)`;
      lmCap.textContent = `${money(15000 - (notes - 430) * 100)} approx. capacity`;
    }
    function resetCassette() { setCassette(0); }
    async function fillCassette() {
      const ms = 1200, out = t => 1 - Math.pow(2, -10 * t);   // expo.out, same curve as --ease
      for (let e = 0; e < ms; e += 16) { setCassette(out(e / ms)); await sleep(16); }
      setCassette(1);
    }
    async function type(str) { for (const ch of str) { typedText.textContent += ch; await sleep(ch === ',' || ch === '.' ? 160 : 95); } }

    async function loop() {
      place();
      for (;;) {
        // 1 · Account and transaction details: enter the amount
        show('account'); scrollTo(0, true); typedText.textContent = ''; setShape('arrow'); resetCassette();
        say('Enter the deposit amount');
        await sleep(500);
        await moveTo(760, 569, 'text', 800);
        await click(); focusRing.classList.add('is-on'); typed.classList.add('is-focused');
        await sleep(200); cursor.classList.add('is-hidden');
        await type('5,000.00'); await sleep(450);
        focusRing.classList.remove('is-on'); typed.classList.remove('is-focused');
        await moveTo(1150, 913, 'hand', 900);
        await sleep(100); await click(press('next')); await sleep(120);

        // 2 · Count cash: TCR counts the notes, amounts match
        show('count'); setShape('arrow'); say('Count the cash with the TCR');
        await sleep(500);
        await moveTo(841, 393, 'hand', 750);
        await sleep(100); await click(press('count')); await sleep(500);
        show('match'); say('Counted cash matches the deposit amount');
        await fillCassette();                                   // $100 bar grows, notes + value count up
        await sleep(900);

        // 3 · Confirm
        scrollTo(346);
        await moveTo(1327, 1174, 'hand', 1100);
        await sleep(100); await click(press('confirm')); await sleep(120);

        // 4 · Deposit summary
        show('summary'); setShape('arrow'); say('Deposit summary');
        await moveTo(1000, 760, 'arrow', 600);
        await sleep(2200);
      }
    }
    loop();
  })();

  // ---------- Right: responsive view (live reflow) ----------
  (() => {
    const root = document.getElementById('deposit-resp');
    const { sleep } = setup(root);
    const win = root.querySelector('.window');
    const grip = root.querySelector('.resize-cursor');
    let w = 1440;
    const paint = () => {
      win.style.width = w + 'px';
      grip.style.transform = `translate(${720 + w / 2 - 15}px, 945px)`; // grip sits on the bottom-right corner of the centred window
    };
    paint();
    if (reduce) return;

    // Drag the right edge like a person would: ease in, steady, ease out. Layout reflows every frame.
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    async function drag(to, ms) {
      const from = w; let t = 0;
      while (t < ms) { const step = 16; await sleep(step); t += step; w = from + (to - from) * ease(Math.min(1, t / ms)); paint(); }
      w = to; paint();
    }
    async function loop() {
      for (;;) {
        await sleep(1400);
        await drag(430, 3600);  await sleep(1600);
        await drag(1440, 3600);
      }
    }
    loop();
  })();
})();
</script>
